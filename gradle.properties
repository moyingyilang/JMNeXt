#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Sat Feb 28 16:37:08 GMT 2026
android.nonTransitiveRClass=true
org.gradle.parallel=false   # 原始显式设置（保留原状；实测与默认值等价）
android.enableResourceOptimizations=false
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
android.useAndroidX=true

# --- Termux / aarch64 local build tuning ---
# AGP would otherwise pull the linux-x86_64 aapt2 from Maven, which cannot run
# on aarch64. Point it at the arm64 binary from the local build-tools instead.
android.aapt2FromMavenOverride=/data/data/com.termux/files/home/android-sdk/build-tools/35.0.1/aapt2
# Keep the heaps modest: this device has ~3 GB free RAM (plus swap).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

# 关闭 AGP 的「资源优化」步骤（OptimizeResourcesTask）。
#
# 这不是保守设置，而是必需的规避：在本环境（aarch64 + aapt2FromMavenOverride 指向
# arm64 版 aapt2）下，该步骤会产出**空的资源表** —— release 包最终 111 个条目，
# 既没有 AndroidManifest.xml 也没有 resources.arsc，apksigner 报
# 「Missing AndroidManifest.xml」，pm install 直接失败。
# debug 变体不走这个步骤，所以一直正常，问题只在发布包里出现。
#
# 实测：关掉后 release 包立即恢复为 1039 个条目并含 manifest 与 resources.arsc。
# 代价是不再做资源的无用条目裁剪，体积会略大 —— 这是可以接受的，
# 换来的是一个能装得上的发布包。
# 打开资源优化能把 APK 砍掉 32%，但产出的包在新版 Android 上无法解析（nativeOpenXml 失败），
# 虚拟机（Android 9）反而能装 —— 属于设备相关的不兼容，因此保持关闭。见 CHANGELOG 1.7.0。
# 2026-10-05 实测记录：org.gradle.parallel=true 与 workers.max=2 都**没有**稳定收益（受控 A/B 各两轮，差异落在噪声内，
# 且温度已 93-94 度、并发越高越容易热降频），故都不设置。速度上的确定收益见 .work/bench 系列与 docs/STATE.md 的结论：
# 2026-10-05 受控 A/B（同会话交替，app 编译）：--no-daemon 21/14 秒 vs daemon 7/5 秒，温度同为 93 度。
#   -> 结论：**不要**用 --no-daemon；daemon 首次启动只约 2 秒，而每次 fork 新 JVM 要多花 7-16 秒。
#   （此前"一次性构建用 --no-daemon 更快"的测量不可复现，已作废。）
# 已据此清理 desktop/scripts/*.sh 里的 --no-daemon。

# --- 构建耗时优化（本机实测）---
# 配置缓存：跳过每次构建的配置阶段。Gradle 自己在构建末尾提示过可以启用。
org.gradle.configuration-cache=true
# 构建缓存：跨构建复用任务输出。
org.gradle.caching=true
# 限制并发 worker。这台设备的总内存 15GB 但常驻占用极高（实测可用仅 ~1.5GB，
# 且已在用 8GB 以上 swap），并发拉满会转为换页抖动，反而更慢。
# org.gradle.workers.max=2   # 实测反而更慢，见 README：受限的是内存与热，不是并行度。
# 2026-10-05 受控 A/B 复测（同场景、交替顺序、各两轮，app+shared 编译）：
#   默认并发 17/20 秒，workers=2 为 22/21 秒，两者温度同为 93 度
#   -> 确认默认并发更快，故不设此值。此前一次“workers=2 快一倍”的测量不可复现，已作废。

# 环境已有 node（chroot /usr/bin/node），不让 Kotlin 再下载一份
kotlin.js.nodejs.download=false
kotlin.compiler.execution.strategy=daemon
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
